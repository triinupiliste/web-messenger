version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: messenger_password
      POSTGRES_DB: messenger_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/secrets:/app/secrets:ro
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=messenger_user
      - DB_PASSWORD=messenger_password
      - DB_NAME=messenger_db
      - JWT_SECRET=super_secret_messenger_jwt_key_2026
      - ENCRYPTION_KEY=32_byte_hex_or_string_secret_key_here!!
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5000/api}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Web & Mobile Messenger}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-service-account.json
    depends_on:
      - postgres

volumes:
  pgdata: